<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Demo · Inicio</title>

  .track > section { height: 900px; position: relative; }
  .track canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

<body>

    <section class="hero">
      <canvas></canvas>
      <span class="eyebrow">Inicio</span>
      <h1>Bienvenidos a la demo</h1>
    </section>
  </div>
  <section class="reveal">
    <p class="kicker">Integraciones</p>

  <section aria-label="Pieza de impacto"><h2>Grande</h2><p>Texto de impacto.</p></section>
