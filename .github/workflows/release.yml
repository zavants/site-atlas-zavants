# Bump with `node scripts/set-version.mjs 0.2.0`, then tag it (git tag v0.2.0 && git push --tags) to:
#   1. build the package and attach site-atlas.tgz to a GitHub release (what install.sh downloads),
#   2. publish it to npm when the NPM_TOKEN secret is set.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # The package and both plugin manifests carry the version. `scripts/set-version.mjs` bumps them
      # together; this fails the release when the tag and any of them have drifted apart.
      - name: The tag matches every manifest
        run: node scripts/set-version.mjs --check "${GITHUB_REF_NAME#v}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack
        run: |
          npm pack
          cp site-atlas-*.tgz site-atlas.tgz
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" site-atlas.tgz site-atlas-*.tgz --title "${GITHUB_REF_NAME}" --generate-notes
      - name: Publish to npm
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish site-atlas.tgz --provenance --access public
